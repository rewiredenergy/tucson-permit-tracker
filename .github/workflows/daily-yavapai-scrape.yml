# Runs the Yavapai County Property Tracker once a day. Yavapai has
# ~186.5k parcels, pulled from the ADWR statewide fallback FeatureServer
# in pages of 2000. A full sweep finishes in a handful of minutes -- no
# resumable checkpoint needed at this scale (same as Santa Cruz/Yuma/
# Cochise/Navajo/Apache/Gila/Graham/Greenlee/La Paz).
#
# 16:30 UTC = 9:30 AM Phoenix time (after the Pinal scrape at 9:00 AM).
# Arizona does not observe DST, so Phoenix is always UTC-7.
#
# SCHEDULE RE-ENABLED (2026-08-15): the source was switched from
# gis.yavapaiaz.gov (permanently blocked by a WAF on GitHub Actions runner
# IPs -- confirmed with two independent bypass attempts) to the same ADWR
# statewide FeatureServer already used for Graham/Greenlee/La Paz. See the
# NOTE in yavapai_property_tracker.py and COUNTIES.md for the full history.

name: Daily Yavapai County property scrape

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: "Test mode: only upsert this many parcels (leave blank for a full run)"
        required: false
        default: ""
      max_runtime_minutes:
        description: "Runtime budget in minutes (leave blank for default 55)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: yavapai-property-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Yavapai County property scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes }}
          PYTHONUNBUFFERED: "1"
        run: python yavapai_property_tracker.py
