# Runs the Mohave County Property Tracker once a day. Mohave has ~267k
# parcels, pulled from a single public bulk ArcGIS MapServer layer in
# pages of 2000 -- above the repo's ~200k threshold, so progress is
# checkpointed in mohave_scrape_state (resumable ArcGIS resultOffset) same
# as Maricopa/Pinal, rather than always restarting from the top.
#
# 17:30 UTC = 10:30 AM Phoenix time (30 min after the Yuma slot at 10:00
# AM). Arizona does not observe DST, so Phoenix is always UTC-7.

name: Daily Mohave County property scrape

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: "Test mode: only upsert this many parcels (leave blank for a full run)"
        required: false
        default: ""
      max_runtime_minutes:
        description: "Runtime budget in minutes (leave blank for default 55)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mohave-property-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Mohave County property scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes }}
          PYTHONUNBUFFERED: "1"
        run: python mohave_property_tracker.py
