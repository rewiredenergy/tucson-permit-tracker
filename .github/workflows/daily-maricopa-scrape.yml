# Runs the Maricopa County Property Tracker once a day. Maricopa is the
# largest county in this repo by far (~1.76M parcels, ~40x Santa Cruz),
# pulled from a single public bulk ArcGIS FeatureServer layer in pages
# of 2000. A full sweep may take more than one run -- progress is
# checkpointed in the maricopa_scrape_state table, so each run just
# continues from where the last one left off.
#
# 15:30 UTC = 8:30 AM Phoenix time (after the permit scrape at 6:00 AM,
# sales scrape at 6:30 AM, Pima property-info scrape at 7:30 AM, and
# Santa Cruz scrape at 8:00 AM).

name: Daily Maricopa County property scrape

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: "Test mode: only upsert this many parcels (leave blank for a full time-boxed run)"
        required: false
        default: ""
      max_runtime_minutes:
        description: "Runtime budget in minutes (leave blank for default 55)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: maricopa-property-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Maricopa County property scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes }}
          PYTHONUNBUFFERED: "1"
        run: python maricopa_property_tracker.py
