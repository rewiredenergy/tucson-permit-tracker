# Runs the Property Info Tracker (Pima County parcel enrichment). This is a
# full-county sweep of ~448k parcels -- one run only gets through a slice of
# it (time-boxed by MAX_RUNTIME_MINUTES), picking up where the previous run
# left off. Parcels already seen by the permit/sales trackers are enriched
# first.
#
# TEMPORARILY running TWICE a day (~7am and ~7pm Phoenix time) to clear the
# large one-time county-sweep backlog faster. Once the backlog is cleared
# (pending count for the general county sweep, source_priority IS NULL,
# reaches ~0), drop the second cron entry below and go back to once a day --
# daily new permits/sales are a trivial trickle once the backlog is gone.
#
# 14:30 UTC = 7:30 AM Phoenix time (after the permit scrape at 6:00 AM and
# the sales scrape at 6:30 AM). 02:30 UTC = 7:30 PM Phoenix time (clear of
# every other tracker's schedule).

name: Daily property info scrape

on:
  schedule:
    - cron: "30 14 * * *"
        - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: "Test mode: only enrich this many parcels (leave blank for a full time-boxed run)"
        required: false
        default: ""
      max_runtime_minutes:
        description: "Runtime budget in minutes (leave blank for default 320)"
        required: false
        default: ""
      skip_seed:
        description: "Skip the full-roster reseed + priority tagging (faster re-tests; leave blank for normal runs)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: property-info-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run property info scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes }}
          SKIP_SEED: ${{ github.event.inputs.skip_seed }}
          PYTHONUNBUFFERED: "1"
        run: python property_info_tracker.py
